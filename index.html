<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8fc">
<title>DPL302 Study Space — Quizlet-style</title>
<style>
:root{
  --bg:#f6f7fb;--surface:#fff;--surface-2:#f1f3fa;--ink:#17213a;--muted:#75809a;
  --line:#e5e8f1;--brand:#6558d3;--brand-2:#8378ed;--brand-soft:#eeecff;
  --green:#16865d;--green-bg:#e7f7ef;--red:#c34255;--red-bg:#fff0f1;--amber:#a86d12;--amber-bg:#fff5df;
  --shadow:0 16px 44px rgba(31,40,75,.08);--radius:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-shell{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px}
.brand-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#5f54cf,#9388ff);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:800;box-shadow:0 8px 18px #7569db45}
.brand-name{font-weight:800;letter-spacing:-.4px;font-size:15px}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#a0a7b8;font-weight:800;padding:0 12px;margin-bottom:8px}
.nav-list{display:grid;gap:5px}
.nav-btn{border:0;background:transparent;color:#68728b;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:12px;text-align:left;font-size:13px;font-weight:650;transition:.18s}
.nav-btn:hover{background:#f6f5ff;color:var(--brand)}
.nav-btn.active{background:var(--brand-soft);color:var(--brand)}
.nav-icon{width:20px;text-align:center;font-size:17px}
.sidebar-bottom{margin-top:auto;padding:14px;border-radius:16px;background:#f7f6ff;border:1px solid #eeecff}
.sidebar-bottom strong{display:block;font-size:12px;margin-bottom:5px}
.sidebar-bottom span{font-size:11px;color:var(--muted);line-height:1.5}
.main{min-width:0;padding:24px clamp(18px,3vw,44px) 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
.mobile-brand{display:none}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn,.secondary-btn,.primary-btn,.ghost-btn{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:10px 14px;font-weight:700;font-size:12px;transition:.18s}
.icon-btn:hover,.secondary-btn:hover,.ghost-btn:hover{border-color:#c8c2fa;background:#fbfaff}
.primary-btn{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 7px 16px #6558d333}
.primary-btn:hover{background:#5548c3;transform:translateY(-1px)}
.ghost-btn{background:transparent}
.page-title{font-size:27px;letter-spacing:-1px;margin:0 0 7px;font-weight:850}
.page-subtitle{font-size:13px;color:var(--muted);margin:0;line-height:1.6}
.hero{border-radius:24px;background:linear-gradient(115deg,#24234e 0%,#433b91 55%,#7166dc 100%);padding:30px 32px;color:#fff;position:relative;overflow:hidden;box-shadow:0 20px 42px #40388c30}
.hero:after{content:"";position:absolute;width:310px;height:310px;border:1px solid #ffffff24;border-radius:50%;right:7%;top:-175px;box-shadow:0 0 0 35px #ffffff09,0 0 0 75px #ffffff07}
.hero-kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c7c2ff;font-weight:800}
.hero h1{font-size:clamp(24px,3vw,34px);letter-spacing:-1px;margin:12px 0 9px;max-width:560px;line-height:1.14}
.hero p{font-size:13px;color:#d7d5f7;line-height:1.65;max-width:540px;margin:0 0 20px}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;position:relative;z-index:1}
.hero .primary-btn{background:#fff;color:#40388c;border-color:#fff;box-shadow:none}
.hero .secondary-btn{background:#ffffff12;border-color:#ffffff45;color:#fff}
.hero .secondary-btn:hover{background:#ffffff22}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:18px 0 28px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0}
.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:650}
.stat-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:15px}
.stat-value{font-size:25px;letter-spacing:-1px;font-weight:850;margin-top:9px}
.stat-foot{font-size:10px;color:var(--muted);margin-top:3px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 13px}
.section-head h2{font-size:17px;letter-spacing:-.4px;margin:0}
.section-head p{font-size:11px;color:var(--muted);margin:5px 0 0}
.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.topic-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;display:flex;align-items:center;gap:13px;transition:.2s;cursor:pointer}
.topic-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d2cdfd}
.topic-icon{width:42px;height:42px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-size:19px;flex:none}
.topic-info{min-width:0;flex:1}
.topic-info strong{display:block;font-size:12px;line-height:1.4}
.topic-info span{font-size:10px;color:var(--muted);display:block;margin-top:4px}
.topic-count{font-size:12px;color:var(--brand);font-weight:800}
.content-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:18px 0}
.field,.select-field{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink);font-size:12px;outline:none}
.field:focus,.select-field:focus,textarea:focus{border-color:#9289ee;box-shadow:0 0 0 3px #8378ed1a}
.search-field{min-width:230px;flex:1}
.progress-track{height:7px;border-radius:20px;background:#eceef5;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),#9c92ff);border-radius:20px;transition:width .25s}
.progress-row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin:10px 0 13px}
.flashcard-wrap{max-width:820px;margin:0 auto}
.flashcard{min-height:370px;perspective:1200px;cursor:pointer}
.flash-inner{position:relative;min-height:370px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1)}
.flashcard.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:var(--shadow);padding:28px 32px;display:flex;flex-direction:column}
.flash-back{transform:rotateY(180deg);background:linear-gradient(145deg,#fff,#f8f7ff)}
.card-topline{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:11px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:30px;background:var(--brand-soft);color:var(--brand);font-size:10px;font-weight:800;padding:6px 10px}
.flash-question{font-size:clamp(19px,2.2vw,25px);font-weight:800;letter-spacing:-.6px;line-height:1.42;margin:36px 0 22px}
.flash-options{display:grid;gap:9px;margin-top:auto}
.flash-option{border:1px solid var(--line);border-radius:11px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start;font-size:12px;line-height:1.5;color:#59637c}
.option-letter{width:23px;height:23px;border-radius:7px;background:#f0f1f7;color:#606b83;display:grid;place-items:center;font-size:10px;font-weight:850;flex:none}
.flash-back .answer-letter{font-size:12px;color:var(--green);font-weight:850;letter-spacing:1px;text-transform:uppercase}
.flash-back .answer-text{font-size:clamp(21px,2.6vw,29px);line-height:1.35;font-weight:850;letter-spacing:-.6px;margin:15px 0}
.answer-note{background:var(--green-bg);border:1px solid #c8eedb;color:#267854;padding:13px 15px;border-radius:12px;font-size:12px;line-height:1.55}
.flip-hint{margin-top:auto;text-align:center;color:#9aa2b4;font-size:10px}
.study-controls{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:17px 0}
.study-controls .primary-btn{min-width:120px}
.study-nav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px}
.study-nav span{font-size:11px;color:var(--muted)}
.choice-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.choice-btn{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;color:var(--ink);font-size:12px;line-height:1.5;transition:.16s}
.choice-btn:hover:not(:disabled){border-color:#a8a0f1;background:#fbfaff}
.choice-btn .option-letter{margin-top:0}
.choice-btn.correct{border-color:#5fc69b;background:var(--green-bg);color:#176b4a}
.choice-btn.selected{border-color:#9b92f0;background:#f2f0ff;color:#4d43ad}
.choice-btn.wrong{border-color:#ed9aa4;background:var(--red-bg);color:#a83244}
.choice-btn:disabled{cursor:default}
.feedback{padding:14px 16px;border-radius:13px;font-size:12px;line-height:1.6;margin:14px 0}
.feedback.good{background:var(--green-bg);color:#176b4a;border:1px solid #c6ead7}
.feedback.bad{background:var(--red-bg);color:#a83244;border:1px solid #f2c6cc}
.question-panel{max-width:900px;margin:0 auto}
.question-title{font-size:21px;line-height:1.45;letter-spacing:-.4px;margin:24px 0 8px}
.small-muted{color:var(--muted);font-size:11px}
.result-hero{text-align:center;padding:32px 20px;background:linear-gradient(135deg,#f2f0ff,#fff);border:1px solid #e4e0ff;border-radius:20px}
.result-score{font-size:52px;font-weight:900;letter-spacing:-2px;color:var(--brand);margin:10px 0}
.result-list{display:grid;gap:10px;margin-top:18px}
.result-item{border:1px solid var(--line);border-radius:13px;padding:14px}
.result-item strong{font-size:12px}
.result-item p{font-size:11px;color:var(--muted);line-height:1.5;margin:7px 0}
.bank-list{display:grid;gap:9px}
.bank-item{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}
.bank-id{width:36px;height:36px;border-radius:10px;background:#f0efff;color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:850}
.bank-question{font-size:12px;font-weight:700;line-height:1.5}
.bank-meta{font-size:10px;color:var(--muted);margin-top:4px}
.bank-answer{font-size:11px;color:var(--green);font-weight:850;white-space:nowrap}
.bank-actions{display:flex;gap:6px;align-items:center}
.mini-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;color:#6e7890;font-size:10px;font-weight:750}
.mini-btn:hover{border-color:#bcb5fa;color:var(--brand)}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state strong{display:block;color:var(--ink);font-size:15px;margin:10px 0 5px}
.modal-backdrop{position:fixed;inset:0;background:#11182c80;display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:20px;max-width:680px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px #11182c40}
.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:20px 22px;display:grid;gap:12px}
.form-row{display:grid;gap:6px}
.form-row label{font-size:11px;font-weight:800;color:#68728b}
.form-row textarea,.form-row input,.form-row select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:12px;color:var(--ink);resize:vertical;min-height:42px}
.form-row textarea{min-height:70px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#1d2440;color:#fff;border-radius:12px;padding:11px 16px;font-size:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pagination{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px}
.pagination span{font-size:11px;color:var(--muted)}
.mobile-nav{display:none}
@media(max-width:950px){
 .app-shell{grid-template-columns:210px minmax(0,1fr)}
 .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .main{padding:20px 20px 40px}
}
@media(max-width:700px){
 .app-shell{display:block}
 .sidebar{display:none}
 .main{padding:16px 14px 92px}
 .mobile-brand{display:flex;align-items:center;gap:9px;font-weight:850;font-size:13px}
 .mobile-brand .brand-mark{width:32px;height:32px;font-size:15px;border-radius:10px}
 .topbar{margin-bottom:18px}
 .top-actions .secondary-btn{padding:9px 10px;font-size:10px}
 .hero{padding:24px 20px}
 .topic-grid{grid-template-columns:1fr}
 .choice-list{grid-template-columns:1fr}
 .flash-face{padding:22px 18px}
 .flashcard,.flash-inner{min-height:450px}
 .flash-question{margin:27px 0 18px}
 .stats-grid{gap:9px}
 .stat-card{padding:13px}
 .stat-value{font-size:22px}
 .bank-item{grid-template-columns:36px minmax(0,1fr)}
 .bank-actions{grid-column:2;justify-content:flex-start}
 .bank-answer{grid-column:2}
 .mobile-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:20}
 .mobile-nav button{border:0;background:transparent;color:#8b93a7;font-size:9px;font-weight:750;display:grid;gap:3px;justify-items:center;padding:5px 0}
 .mobile-nav button span{font-size:17px}
 .mobile-nav button.active{color:var(--brand)}
 .study-nav{align-items:flex-start}
 .study-controls{gap:6px}
}
</style>
</head>

ering \"cat\" until \"was\" is hard for a basic RNN mainly because of what?","options":{"A":"Exploding gradients","B":"Too large a vocabulary","C":"Vanishing gradients","D":"Too few hidden units"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-07 235543.png","correctText":"Vanishing gradients","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":15,"section":"RNN, NLP & Attention","question":"In a GRU, how are the memory cell c(t) and the activation a(t) related?","options":{"A":"c(t) = a(t)","B":"c(t) = 1 - a(t)","C":"They are unrelated","D":"c(t) = 2a(t)"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-07 235546.png","correctText":"c(t) = a(t)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":16,"section":"RNN, NLP & Attention","question":"In a GRU, what happens when the update gate Γ_u ≈ 0?","options":{"A":"The memory cell is reset to zero","B":"The output becomes random","C":"The cell takes the new candidate value","D":"c(t−1) is kept unchanged, which helps avoid vanishing gradients"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-07 235635.png","correctText":"c(t−1) is kept unchanged, which helps avoid vanishing gradients","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":17,"section":"RNN, NLP & Attention","question":"What does the relevance gate Γ_r in a GRU control?","options":{"A":"The size of the vocabulary","B":"How relevant c(t−1) is to computing the candidate c̃(t)","C":"The learning rate","D":"The output softmax"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-07 235639.png","correctText":"How relevant c(t−1) is to computing the candidate c̃(t)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":18,"section":"RNN, NLP & Attention","question":"Which three gates does an LSTM have?","options":{"A":"Update (input), forget and output","B":"Update and relevance only","C":"Reset, attention and output","D":"Query, key and value"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-07 235643.png","correctText":"Update (input), forget and output","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":19,"section":"RNN, NLP & Attention","question":"How do GRU and LSTM compare?","options":{"A":"GRU has three gates, LSTM has two","B":"LSTM is always faster than GRU","C":"GRU is simpler and faster; LSTM is more powerful and has long been the default first choice","D":"They are identical"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-07 235700.png","correctText":"GRU is simpler and faster; LSTM is more powerful and has long been the default first choice","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":20,"section":"RNN, NLP & Attention","question":"What is the main disadvantage of a bidirectional RNN?","options":{"A":"It cannot use LSTM units","B":"It needs the entire sequence before predicting, so it does not suit real-time speech recognition","C":"It only reads the future","D":"It cannot be used for NER"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-07 235706.png","correctText":"It needs the entire sequence before predicting, so it does not suit real-time speech recognition","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":21,"section":"RNN, NLP & Attention","question":"What was the main motivation for Transformers over RNN/GRU/LSTM?","options":{"A":"To use fewer attention layers","B":"To remove embeddings","C":"To process one word at a time more carefully","D":"To process the whole sequence in parallel instead of sequentially"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-07 235710.png","correctText":"To process the whole sequence in parallel instead of sequentially","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":22,"section":"RNN, NLP & Attention","question":"What is the main weakness of one-hot word vectors?","options":{"A":"They are too short","B":"They use too little memory","C":"All vectors are orthogonal, so the model cannot generalize between related words","D":"They cannot be en lots of task data already exists","B":"Named entity recognition","C":"Text summarization","D":"Co-reference resolution"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-07 235729.png","correctText":"Language modeling and machine translation when lots of task data already exists","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":27,"section":"RNN, NLP & Attention","question":"How is the analogy \"man is to woman as king is to ?\" solved?","options":{"A":"Find w that minimizes sim(e_w, e_man)","B":"Pick the most frequent word","C":"Find w maximizing sim(e_w, e_king - e_man + e_woman), giving \"queen\"","D":"Use t-SNE coordinates directly"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-07 235733.png","correctText":"Find w maximizing sim(e_w, e_king - e_man + e_woman), giving \"queen\"","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":28,"section":"RNN, NLP & Attention","question":"What is the cosine similarity of two vectors pointing in the same direction?","options":{"A":"0","B":"-1","C":"0.5","D":"1"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-07 235737.png","correctText":"1","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":29,"section":"RNN, NLP & Attention","question":"With embedding matrix E (300 × 10,000) and one-hot vector O_j, what is E · O_j?","options":{"A":"A 10,000x1 vector","B":"The embedding e_j (300×1) of word j","C":"The whole matrix E","D":"A scalar"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-07 235742.png","correctText":"The embedding e_j (300×1) of word j","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":30,"section":"RNN, NLP & Attention","question":"How is the embedding of a word obtained in practice?","options":{"A":"By full matrix multiplication E - O;","B":"By training a new network","C":"By looking up the column directly (e.g., a Keras Embedding layer)","D":"By averaging all columns"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-07 235747.png","correctText":"By looking up the column directly (e.g., a Keras Embedding layer)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":31,"section":"RNN, NLP & Attention","question":"In Bengio's neural language model with a window of 4 previous words and 300-d embeddings, what is the size of the concatenated input?","options":{"A":"1200","B":"300","C":"4","D":"10,000"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-07 235750.png","correctText":"1200","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":32,"section":"RNN, NLP & Attention","question":"What does the skip-gram model do?","options":{"A":"Predicts the middle word from its neighbors","B":"Counts word co-occurrences","C":"Translates sentences","D":"Picks a context word and predicts a target word within a window around it"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-07 235848.png","correctText":"Picks a context word and predicts a target word within a window around it","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":33,"section":"RNN, NLP & Attention","question":"What is the main computational problem of the skip-gram softmax?","options":{"A":"It has no parameters","B":"Its denominator sums over the whole vocabulary, which is very slow","C":"It cannot be trained","D":"It needs labeled data"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-07 235851.png","correctText":"Its denominator sums over the whole vocabulary, which is very slow","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":34,"section":"RNN, NLP & Attention","question":"Why is the dot product divided by √d_k in scaled dot-product attention?","options":{"A":"To keep dot products from becoming too large, avoiding a saturated softmax and exploding gradients","B":"To increase the number of heads","C":"To normalize the vocabulary","D":"To make attention sequential"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-07 235856.png","correctText":"To keep dot products from becoming too large, avoiding a saturated softmax and exploding gradients","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":35,"section":"RNN, NLP & Attention","question":"What does CBOW (continuous bag-of-words) do?","options":{"A":"Predicts a context word from the target","B":"Classifies word pairs as real or fake","C":"Uses surrounding words to predict the middle word","D":"Builds a co-occurrence matrix"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-07 235900.png","correctText":"Uses surrounding words to predict the middle word","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":36,"section":"RNN, NLP & Attention","question":"What values of k are suggested for negative sampling?","options":{"A":"k = 100-200 for every dataset","B":"k = 5-20 for small datasets, 2—5 for large datasets","C":"k = 1 always","D":"k equal to the vocabulary size"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-07 235905.png","correctText":"k = 5-20 for small datasets, 2—5 for large datasets","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":37,"section":"RNN, NLP & Attention","question":"Why is negative sampling cheaper than the full softmax?","options":{"A":"It removes the embedding matrix","B":"It uses no labels","C":"It only trains on positive pairs","D":"Each iteration only updates k + 1 binary classifiers instead of a 10,000-way softmax"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-07 235909.png","correctText":"Each iteration only updates k + 1 binary classifiers instead of a 10,000-way softmax","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":38,"section":"RNN, NLP & Attention","question":"What is multi-head attention?","options":{"A":"One attention head applied many times with the same weights","B":"Attention over several sentences","C":"Several self-attention heads, each with its own Wi*Q, Wi'K, Wi*V, asking different questions in parallel","D":"A recurrent attention unit"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-07 235912.png","correctText":"Several self-attention heads, each with its own Wi*Q, Wi'K, Wi*V, asking different questions in parallel","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":39,"section":"RNN, NLP & Attention","question":"In GloVe, what does X_ij represent?","options":{"A":"The number of times word i appears in the context of word j","B":"The cosine similarity of words i and j","C":"The embedding of word i","D":"The probability of word j"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-07 235917.png","correctText":"The number of times word i appears in the context of word j","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":40,"section":"RNN, NLP & Attention","question":"How does the Transformer give the model information about word order?","options":{"A":"With recurrent connections","B":"With max pooling","C":"By sorting the words","D":"By adding positional encodings built from sine and cosine functions to the embeddings"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-07 235921.png","correctText":"By adding positional encodings built from sine and cosine functions to the embeddings","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":41,"section":"RNN, NLP & Attention","question":"In GloVe, how is the final embedding of word w obtained?","options":{"A":"e_w only","B":"The average (e_w + θ_w) / 2","C":"θ_w only","D":"e_w × θ_w"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-07 235926.png","correctText":"The average (e_w + θ_w) / 2","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":42,"section":"RNN, NLP & Attention","question":"Why does the simple averaging model fail on \"Completely lacking in good taste, good service, and good ambience\"?","options":{"A":"It ignores word order, so the many \"good\" words make it look positive","B":"It cannot handle long sentences","C":"It has no embeddings","D":"It only works for 5-star reviews"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-07 235930.png","correctText":"It ignores word order, so the many \"good\" words make it look positive","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":43,"section":"RNN, NLP & Attention","question":"What is the order of steps for debiasing word embeddings (Bolukbasi et al., 2016)?","options":{"A":"Equalize — neutralize — identify","B":"Neutralize — identify — equalize","C":"Identify the bias direction — neutralize — equalize pairs","D":"Retrain all embeddings from scratch"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-07 235933.png","correctText":"Identify the bias direction — neutralize — equalize pairs","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":44,"section":"RNN, NLP & Attention","question":"Which words are neutralized during debiasing?","options":{"A":"Grandmother and grandfather","B":"He and she","C":"All words in the vocabulary","D":"Words that are not definitional for gender, such as doctor and babysitter"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-07 235938.png","correctText":"Words that are not definitional for gender, such as doctor and babysitter","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":45,"section":"RNN, NLP & Attention","question":"Why is machine translation called a conditional language model?","options":{"A":"It only works on conditional sentences","B":"The decoder estimates P(y(1), ..., y(Ty) given x), starting from the encoder output instead of a zero vector","C":"It uses an if-statement","D":"It samples randomly"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-07 235942.png","correctText":"The decoder estimates P(y(1), ..., y(Ty) given x), starting from the encoder output instead of a zero vector","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":46,"section":"RNN, NLP & Attention","question":"Why is greedy search a poor choice for translation?","options":{"A":"It is too slow","B":"It needs a large beam width","C":"Choosing the best word at each step (e.g., \"going\" after \"Jane is\") can lead to a worse overall sentence","D":"It cannot produce (EOS)"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-07 235947.png","correctText":"Choosing the best word at each step (e.g., \"going\" after \"Jane is\") can lead to a worse overall sentence","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":47,"section":"RNN, NLP & Attention","question":"What does beam search become when B = 1?","options":{"A":"Greedy search","B":"Exhaustive search","C":"Random sampling","D":"Breadth-first search"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-07 235951.png","correctText":"Greedy search","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":48,"section":"RNN, NLP & Attention","question":"Why is masked multi-head attention used in the Transformer decoder during training?","options":{"A":"To hide the source sentence","B":"To reduce the number of heads","C":"To add noise like dropout","D":"To hide later target words so the model cannot peek ahead while predicting left to right"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 000025.png","correctText":"To hide later target words so the model cannot peek ahead while predicting left to right","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":49,"section":"RNN, NLP & Attention","question":"What does length normalization in beam search do?","options":{"A":"Maximizes the product of probabilities directly","B":"Sums log probabilities and divides by Ty*a (a = 0.7) to reduce the bias toward short sentences","C":"Removes the (EOS) token","D":"Fixes all sentences to 30 words"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 000028.png","correctText":"Sums log probabilities and divides by Ty*a (a = 0.7) to reduce the bias toward short sentences","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":50,"section":"RNN, NLP & Attention","question":"In beam search error analysis, P(y* given x) > P(y given x). Which component is at fault?","options":{"A":"Beam search, so increase B","B":"The RNN model","C":"The BLEU score","D":"The training data labels"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 000032.png","correctText":"Beam search, so increase B","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":51,"section":"RNN, NLP & Attention","question":"For the output \"the the the the the the the.\" with references \"The cat is on the mat.\" / \"There is a cat on the mat.\", what is the modified unigram precision?","options":{"A":"7/7","B":"1/7","C":"2/7","D":"0"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 000036.png","correctText":"2/7","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":52,"section":"RNN, NLP & Attention","question":"What is the purpose of the brevity penalty in BLEU?","options":{"A":"To reward very short outputs","B":"To penalize translations that are too short","C":"To penalize repeated words","D":"To weight bigrams more than unigrams"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 000040.png","correctText":"To penalize translations that are too short","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":53,"section":"RNN, NLP & Attention","question":"In the attention model, what does α(t, t′) represent?","options":{"A":"The probability of word t in the vocabulary","B":"The learning rate at step t","C":"The length of the output","D":"How much attention output step t pays to input word t′"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 000208.png","correctText":"How much attention output step t pays to input word t′","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":54,"section":"RNN, NLP & Attention","question":"What is a drawback of the attention model for translation?","options":{"A":"It cannot handle long sentences","B":"It needs no training","C":"Its cost is quadratic, O(Tx x Ty)","D":"It only works with CNNs"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 000211.png","correctText":"Its cost is q :"27x27","C":"28x28","D":"30x30"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 000632.png","correctText":"28x28","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":99,"section":"Convolutional Neural Networks","question":"When convolving an RGB image, how many channels must each filter have?","options":{"A":"1","B":"As many as the number of filters","C":"Always 64","D":"The same number as the input channels (3)"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 000636.png","correctText":"The same number as the input channels (3)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":100,"section":"Convolutional Neural Networks","question":"A 6x6x3 input is convolved with two 3x3x3 filters (vertical and horizontal edges). What is the output?","options":{"A":"4x4x3","B":"4x4x2","C":"6x6x2","D":"4x4x6"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 000641.png","correctText":"4x4x2","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":101,"section":"Convolutional Neural Networks","question":"A layer has 10 filters of size 3x3x3. How many parameters does it have (including biases)?","options":{"A":"270","B":"90","C":"280","D":"300"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 000644.png","correctText":"280","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":102,"section":"Convolutional Neural Networks","question":"What is the total weight shape of convolution layer l?","options":{"A":"f^(l) × f^(l) × n_c^(l−1) × n_c^(l)","B":"n_H^(l) × n_W^(l) × n_c^(l)","C":"f^(l) × f^(l)","D":"1 × 1 × 1 × n_c^(l)"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 000648.png","correctText":"f^(l) × f^(l) × n_c^(l−1) × n_c^(l)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":103,"section":"Convolutional Neural Networks","question":"Input 39x39x3, CONV with f = 3, s = 1, p = 0 and 10 filters. What is the output?","options":{"A":"39x39x10","B":"36x36x10","C":"13x13x10","D":"37x37x10"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 000652.png","correctText":"37x37x10","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":104,"section":"Convolutional Neural Networks","question":"As you go deeper in a typical CNN, what happens to n_H, n_W and n_c?","options":{"A":"All three increase","B":"n_H and n_W decrease, n_c increases","C":"n_H and n_W increase, n_c decreases","D":"All three stay the same"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 000656.png","correctText":"n_H and n_W decrease, n_c increases","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":105,"section":"Convolutional Neural Networks","question":"Max pooling with f = 2, s = 2 is applied to a 4x4 input. What is the output size?","options":{"A":"2x2","B":"3x3","C":"4x4","D":"1x1"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 000700.png","correctText":"2x2","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":106,"section":"Convolutional Neural Networks","question":"How many learnable parameters does a pooling layer have?","options":{"A":"f × f","B":"One per channel","C":"None","D":"f × f × n_c"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 000703.png","correctText":"None","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":107,"section":"Convolutional Neural Networks","question":"How does pooling treat the channels of its input?","options":{"A":"It sums all channels into one","B":"It doubles the number of channels","C":"It keeps only the first channel","D":"It pools each channel separately, so the number of channels is unchanged"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 000707.png","correctText":"It pools each channel separately, so the number of channels is unchanged","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":108,"section":"Convolutional Neural Networks","question":"In the LeNet-style example, CONV1 has 6 filters of 5x5 on a 32x32x3 input. How many parameters does CONV1 have?","options":{"A":"150","B":"456","C":"4704","D":"2416"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 000710.png","correctText":"456","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":109,"section":"Convolutional Neural Networks","question":"In a typical CNN such as LeNet-5, where are most of the parameters?","options":{"A":"In the pooling layers","B":"In the input layer","C":"In the fully connected layers","D":"In the first convolution layer"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 000715.png","correctText":"In the fully connected layers","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":110,"section":"Convolutional Neural Networks","question":"Which statement about LeNet-5 is correct?","options":{"A":"It was proposed by Yann LeCun et al. (1998), takes 32x32x1 inputs and has about 60K parameters","B":"It has about 138M parameters","C":"It uses 227x227x3 inputs","D":"It introduced skip connections"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 000718.png","correctText":"It was proposed by Yann LeCun et al. (1998), takes 32x32x1 inputs and has about 60K parameters","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":111,"section":"Convolutional Neural Networks","question":"Which statement about AlexNet is correct?","options":{"A":"It has about 60K parameters","B":"It has about 60M parameters and popularized ReLU","C":"It uses only 3x3 filters","D":"It was designed for mobile devices"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 000722.png","correctText":"It has about 60M parameters and popularized ReLU","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":112,"section":"Convolutional Neural Networks","question":"What characterizes VGG-16?","options":{"A":"Inception modules with parallel filters","B":"Depthwise separable convolutions","C":"Residual connections","D":"Uniform 3x3 same convolutions and 2x2 max-pools, about 138M parameters"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 000725.png","correctText":"Uniform 3x3 same convolutions and 2x2 max-pools, about 138M parameters","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":113,"section":"Convolutional Neural Networks","question":"In a residual block, how is a^[l+2] computed?","options":{"A":"a^[l+2] = g(z^[l+2])","B":"a^[l+2] = a^[l]","C":"a^[l+2] = g(z^[l+2] + a^[l])","D":"a^[l+2] = z^[l+2] − a^[l]"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 000729.png","correctText":"a^[l+2] = g(z^[l+2] + a^[l])","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":114,"section":"Convolutional Neural Networks","question":"Why does adding residual blocks rarely hurt performance?","options":{"A":"A residual block can easily learn the identity function when W, b = 0","B":"Residual blocks have no parameters","C":"They remove the need for activations","D":"They use larger filters"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 000734.png","correctText":"A residual block can easily learn the identity function when W, b = 0","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":115,"section":"Convolutional Neural Networks","question":"In ResNet, what is done if z^[l+2] and a^[l] have different dimensions?","options":{"A":"The skip connection is removed","B":"Max pooling is applied to z","C":"The block is skipped","D":"a^[l] is multiplied by a matrix W_s"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 000738.png","correctText":"a^[l] is multiplied by a matrix W_s","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":116,"section":"Convolutional Neural Networks","question":"What is a main use of 1x1 convolutions?","options":{"A":"To increase height and width","B":"To shrink the number of channels (e.g., 28x28x192 — 28x28x32)","C":"To detect edges","D":"To replace pooling"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 000741.png","correctText":"To shrink the number of channels (e.g., 28x28x192 — 28x28x32)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":117,"section":"Convolutional Neural Networks","question":"Computing 28x28x32 outputs from 28x28x192 with a direct 5x5 same convolution costs about how many multiplications?","options":{"A":"2.4 million","B":"12.4 million","C":"120 million","D":"1.2 billion"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 000746.png","correctText":"120 million","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":118,"section":"Convolutional Neural Networks","question":"Using a 1x1 bottleneck (16 filters) before the 5x5 convolution reduces the cost to about how much?","options":{"A":"12.4 million","B":"120 million","C":"60 million","D":"1 million"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 000750.png","correctText":"12.4 million","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":119,"section":"Convolutional Neural Networks","question":"What is the purpose of the side branches in GoogLeNet (Inception network)?","options":{"A":"Making predictions from intermediate layers, which has a regularizing effect","B":"Increasing the input resolution","C":"Replacing the softmax","D":"Computing residual connections"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 000755.png","correctText":"Making predictions from intermediate layers, which has a regularizing effect","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":120,"section":"Convolutional Neural Networks","question":"What does MobileNet replace normal convolutions with?","options":{"A":"5×5 convolutions","B":"Fully connected layers","C":"Average pooling","D":"Depthwise separable convolutions (depthwise + pointwise)"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 000759.png","correctText":"Depthwise separable convolutions (depthwise + pointwise)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":121,"section":"Convolutional Neural Networks","question":"For input 6×6×3 and output 4×4×5, how do the costs of normal and depthwise separable convolution compare?","options":{"A":"672 vs 2160","B":"2160 vs 2160","C":"2160 vs 672","D":"432 vs 240"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 000804.png","correctText":"2160 vs 672","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":122,"section":"Convolutional Neural Networks","question":"What does a MobileNet v2 bottleneck block contain?","options":{"A":"Expansion (1x1) — depthwise — projection (pointwise), plus a residual connection","B":"Only a 5x5 convolution","C":"Three fully connected layers","D":"An inception module"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 000809.png","correctText":"Expansion (1x1) — depthwise — projection (pointwise), plus a residual connection","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":123,"section":"Convolutional Neural Networks","question":"What is the key idea of EfficientNet?","options":{"A":"Removing all pooling layers","B":"Using only 1x1 convolutions","C":"Training without labels","D":"Compound scaling of resolution, depth and width according to the compute budget"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 000814.png","correctText":"Compound scaling of resolution, depth and width according to the compute budget","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":124,"section":"Convolutional Neural Networks","question":"For transfer learning with very little data (Tigger / Misty / Neither), what should you do?","options":{"A":"Train the whole network from scratch","B":"Freeze all pre-trained layers and train only a new softmax layer","C":"Use no pre-trained weights","D":"Retrain all layers with random initialization"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 000818.png","correctText":"Freeze all pre-trained layers and train only a new softmax layer","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":125,"section":"Convolutional Neural Networks","question":"What is color shifting in data u theo tên ảnh"},{"id":129,"section":"Convolutional Neural Networks","question":"A face landmark detector predicts 64 points plus whether a face is present. How many outputs does it have?","options":{"A":"64","B":"65","C":"129","D":"256"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 000842.png","correctText":"129","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":130,"section":"Convolutional Neural Networks","question":"What is the main drawback of sliding windows detection?","options":{"A":"Very high computational cost","B":"It cannot detect cars","C":"It needs no training data","D":"It only works on grayscale images"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 000847.png","correctText":"Very high computational cost","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":131,"section":"Convolutional Neural Networks","question":"In the convolutional implementation of sliding windows, how is an FC layer of 400 units replaced?","options":{"A":"By a max pooling layer","B":"By a dropout layer","C":"By a softmax layer","D":"By 400 filters of size 5x5, giving a 1x1x400 output"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 000852.png","correctText":"By 400 filters of size 5x5, giving a 1x1x400 output","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":132,"section":"Convolutional Neural Networks","question":"A network trained on 14x14x3 crops is run convolutionally on a 16x16x3 image. What is the output?","options":{"A":"1x1x4","B":"2x2x4","C":"8x8x4","D":"4x4x4"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 000856.png","correctText":"2x2x4","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":133,"section":"Convolutional Neural Networks","question":"In YOLO, which grid cell is responsible for an object?","options":{"A":"Every cell the object touches","B":"The top-left cell","C":"The cell containing the object's midpoint","D":"The cell with the most pixels of the object"},"answer":"C","sou  Neural Networks","question":"What problem do anchor boxes solve?","options":{"A":"Two objects whose midpoints fall in the same grid cell","B":"Slow training","C":"Too many classes","D":"Low image resolution"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 000920.png","correctText":"Two objects whose midpoints fall in the same grid cell","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":139,"section":"Convolutional Neural Networks","question":"YOLO with a 3×3 grid, 2 anchor boxes and 3 classes outputs what volume?","options":{"A":"3×3×8","B":"3×3×6","C":"3×3×24","D":"3×3×16"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 000924.png","correctText":"3×3×16","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":140,"section":"Convolutional Neural Networks","question":"How are anchor box shapes chosen?","options":{"A":"They are learned by backprop only","B":"By hand (5—10 shapes) or with K-means","C":"They are always squares","D":"One per image [Pe \"J"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 000927.png","correctText":"By hand (5—10 shapes) or with K-means","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":141,"section":"Convolutional Neural Networks","question":"What does Faster R-CNN change compared with Fast R-CNN?","options":{"A":"It removes region proposals","B":"It uses a segmentation algorithm to propose regions","C":"It uses a convolutional network to propose regions","D":"It classifies one region at a time"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 000931.png","correctText":"It uses a convolutional network to propose regions","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":142,"section":"Convolutional Neural Networks","question":"What does semantic segmentation do?","options":{"A":"Draws one box per object","B":"Assigns a label to the whole image","C":"Detects landmarks","D":"Assigns a label to every pixel"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 0  Network Fundamentals","question":"For f(a) = In(a), what is the slope at a = 2?","options":{"A":"0.5","B":"2","C":"0.69","D":"1 (9)"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 001812.png","correctText":"0.5","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":178,"section":"Sequence Models & Neural Network Fundamentals","question":"For J = 3(a + bc), what is dJ/db?","options":{"A":"3","B":"3b","C":"bc","D":"3c"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 001817.png","correctText":"3c","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":179,"section":"Sequence Models & Neural Network Fundamentals","question":"In the course’s code convention, what does the variable dvar mean?","options":{"A":"The variance of var","B":"The derivative of the final output J with respect to var","C":"The difference between two values of var","D":"The derivative of var with respect to x"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 001821.png","correctText":"The derivative of the final output J with respect to var","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":180,"section":"Sequence Models & Neural Network Fundamentals","question":"In logistic regression backprop, what is dz?","options":{"A":"y-a","B":"a(1 - a)","C":"a-y","D":"-y/a \"J"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 001824.png","correctText":"a-y","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":181,"section":"Sequence Models & Neural Network Fundamentals","question":"For z = w₁x₁ + w₂x₂ + b, what is dw₁?","options":{"A":"x₁ · dz","B":"w₁ · dz","C":"dz / x₁","D":"x₂ · dz"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 001828.png","correctText":"x₁ · dz","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":182,"section":"Sequence Models & Neural Network Fundamentals","question":"What is the main drawback of the for-loop implementation of logistic regression?","options":{"A":"It gives wrong derivatives","B":"It cannot handle binary labels","C":"It needs more memory for weights","D":"It needs two loops (over m examples and n features), which is slow on large data"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 001848.png","correctText":"It needs two loops (over m examples and n features), which is slow on large data","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":183,"section":"Sequence Models & Neural Network Fundamentals","question":"In the dot product demo with one million elements, how did np.dot() compare to a for loop?","options":{"A":"They took the same time","B":"np.dot() took about 1.5 ms vs about 500 ms for the loop (~300x faster)","C":"The for loop was faster","D":"np.dot() was only 2x faster"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 001852.png","correctText":"np.dot() took about 1.5 ms vs about 500 ms for the loop (~300x faster)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":184,"section":"Sequence Models & Neural Network Fundamentals","question":"Why are NumPy built-in functions faster than explicit loops?","options":{"A":"They use less precise numbers","B":"They skip some elements","C":"They use parallel SIMD instructions on CPUs/GPUs","D":"They run on the network"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 001856.png","correctText":"They use parallel SIMD instructions on CPUs/GPUs","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":185,"section":"Sequence Models & Neural Network Fundamentals","question":"In vectorized logistic regression, how is dw computed?","options":{"A":"dw = np.sum(dZ)","B":"dw = np.dot(w.T, X)","C":"dw=A-Y","D":"dw = 1/m - np.dot(X, dZ.T)"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 001900.png","correctText":"dw = 1/m - np.dot(X, dZ.T)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":186,"section":"Sequence Models & Neural Network Fundamentals","question":"Which for loop cannot be removed by vectorization in logistic regressi  = A.sum(axis=0)"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 001918.png","correctText":"cal = A.sum(axis=0)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":191,"section":"Sequence Models & Neural Network Fundamentals","question":"A network with 3 inputs, one hidden layer of 4 units and 1 output is called what?","options":{"A":"A 3-layer network","B":"A 2-layer network (the input layer is not counted)","C":"A 1-layer network","D":"A deep network"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 001923.png","correctText":"A 2-layer network (the input layer is not counted)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":192,"section":"Sequence Models & Neural Network Fundamentals","question":"Why is the hidden layer called \"hidden\"?","options":{"A":"Its true values are not observed in the training set","B":"It has no parameters","C":"It is never updated","D":"It is skipped during prediction"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 001927.png","correctText":"Its true values are not observed in the training set","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":193,"section":"Sequence Models & Neural Network Fundamentals","question":"For a 3–4–1 network, what is the shape of W^(1)?","options":{"A":"(3, 4)","B":"(1, 4)","C":"(4, 3)","D":"(4, 1)"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 001930.png","correctText":"(4, 3)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":194,"section":"Sequence Models & Neural Network Fundamentals","question":"How many learnable parameters does a 3 — 4 — 1 network have?","options":{"A":"16","B":"5","C":"12","D":"21"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 001934.png","correctText":"21","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":195,"section":"Sequence Models & Neural Network Fundamentals","question":"In the matrices Z and A of a vectorized network, what do the horizontal and vertical indices represent?","options":{"A":"Horizontal = hidden units, vertical = training examples","B":"Horizontal = training examples, vertical = hidden units","C":"Both index training examples","D":"Both index layers"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 001938.png","correctText":"Horizontal = training examples, vertical = hidden units","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":196,"section":"Sequence Models & Neural Network Fundamentals","question":"Why is tanh usually better than sigmoid for hidden layers?","options":{"A":"It has no saturation","B":"It outputs only positive values","C":"Its output has a mean close to 0","D":"It is cheaper to compute than ReLU"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 001942.png","correctText":"Its output has a mean close to 0","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":197,"section":"Sequence Models & Neural Network Fundamentals","question":"What is the derivative of the sigmoid activation in terms of a = g(z)?","options":{"A":"a(1 - a)","B":"1 - a?","C":"1ifz>0, else 0","D":"a?"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 001946.png","correctText":"a(1 - a)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":198,"section":"Sequence Models & Neural Network Fundamentals","question":"What is the derivative of tanh in terms of a = g(z)?","options":{"A":"a(1 - a)","B":"0.01 ifz<0","C":"1 - a?","D":"ez"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 001949.png","correctText":"1 - a?","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":199,"section":"Sequence Models & Neural Network Fundamentals","question":"What problem does Leaky ReLU address?","options":{"A":"Exploding outputs for large z","B":"\"Dead neurons\" when z < 0","C":"Non-convex loss functions","D":"Slow matrix multiplication"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 001953.png","correctText":"\"Dead neurons\" when z < 0","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":200,"section":"Sequence Models & Neural Network Fundamentals","question":"Which activation is the default choice for hidden layers?","options":{"A":"Sigmoid","B":"Linear","C":"Softmax","D":"ReLU"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 001957.png","correctText":"ReLU","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":201,"section":"Sequence Models & Neural Network Fundamentals","question":"What happens if every hidden layer uses a linear (identity) activation?","options":{"A":"The whole network is still just a linear function of the input","B":"The network learns faster nonlinear boundaries","C":"The network cannot be trained","D":"The network becomes a CNN"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 002001.png","correctText":"The whole network is still just a linear function of the input","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":202,"section":"Sequence Models & Neural Network Fundamentals","question":"Where is a linear activation acceptable?","options":{"A":"In every hidden layer","B":"In the first layer of a CNN","C":"In the gates of an LSTM","D":"In the output layer of a regression problem, such as house price prediction"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 002004.png","correctText":"In the output layer of a regression problem, such as house price prediction","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":203,"section":"Sequence Models & Neural Network Fundamentals","question":"In a 2-layer network, how is dZ^(1) computed?","options":{"A":"dZ^(1) = A^(1) − Y","B":"dZ^(1) = (W^(2).T @ dZ^(2)) element-wise multiplied by g′^(1)(Z^(1))","C":"dZ^(1) = W^(1) @ X","D":"dZ^(1) = np.sum(dZ^(2))"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 002007.png","correctText":"dZ^(1) = (W^(2).T @ dZ^(2)) element-wise multiplied by g′^(1)(Z^(1))","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":204,"section":"Sequence Models & Neural Network Fundamentals","question":"What is the purpose of keepdims=True in np.sum(dZ, axis=1, keepdims=True)?","options":{"A":"To make the sum faster","B":"To sum over all axes","C":"To keep the shape (n, 1) instead of producing a rank-1 array","D":"To keep the original values of dZ"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 002011.png","correctText":"To keep the shape (n, 1) instead of producing a rank-1 array","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":205,"section":"Sequence Models & Neural Network Fundamentals","question":"What happens if all weights are initialized to zero in a neural network?","options":{"A":"Symmetry: every hidden unit computes the same function and gets the same update","B":"The network trains faster","C":"Gradients explode","D":"Only the bias is learned correctly, which is enough"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 002014.png","correctText":"Symmetry: every hidden unit computes the same function and gets the same update","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":206,"section":"Sequence Models & Neural Network Fundamentals","question":"Why are random weights multiplied by 0.01 at initialization?","options":{"A":"To make the network deeper","B":"To increase the learning rate","C":"To break symmetry in the bias","D":"To keep z small and avoid the saturated regions of sigmoid/tanh"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 002418.png","correctText":"To keep z small and avoid the saturated regions of sigmoid/tanh","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":207,"section":"Sequence Models & Neural Network Fundamentals","question":"Is it fine to initialize the bias b to zeros?","options":{"A":"No, it always causes symmetry","B":"No, the bias must be random","C":"Yes, a zero bias does not cause the symmetry problem","D":"Only for the output layer"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 002423.png","correctText":"Yes, a zero bias does not cause the symmetry problem","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":208,"section":"Sequence Models & Neural Network Fundamentals","question":"In deep network notation, what does L represent?","options":{"A":"The loss function","B":"The number of layers, not counting the input layer","C":"The learning rate","D":"The number of training examples"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 002427.png","correctText":"The number of layers, not counting the input layer","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":209,"section":"Sequence Models & Neural Network Fundamentals","question":"What is the shape of W^(l)?","options":{"A":"(n^(l), n^(l−1))","B":"(n^(l−1), n^(l))","C":"(n^(l), 1)","D":"(n^(l), m)"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 002430.png","correctText":"(n^(l), n^(l−1))","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":210,"section":"Sequence Models & Neural Network Fundamentals","question":"What is the shape of b^(l)?","options":{"A":"(1, n^(l))","B":"(n, 1)","C":"(n^(l), m)","D":"(n^(l), 1)"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 002434.png","correctText":"(n^(l), 1)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":211,"section":"Sequence Models & Neural Network Fundamentals","question":"In the example with n^(0) = 2 and n^(1) = 3, what is the shape of W^(1)?","options":{"A":"(2, 3)","B":"(3, 2)","C":"(3, 1)","D":"(2, 1)"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 002439.png","correctText":"(3, 2)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":212,"section":"Sequence Models & Neural Network Fundamentals","question":"With m training examples, what is the shape of Z^(l) and A^(l)?","options":{"A":"(n^(l), 1)","B":"(m, n^(l))","C":"(n^(l), m)","D":"(n^(l−1), m)"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 002443.png","correctText":"(n^(l), m)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":213,"section":"Sequence Models & Neural Network Fundamentals","question":"In forward propagation of a deep network, can the for loop over layers | = 1..L be removed?","options":{"A":"No, the loop over layers cannot be avoided","B":"Yes, with broadcasting","C":"Yes, with np.dot","D":"Yes, by using a single huge matrix"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 002447.png","correctText":"No, the loop over layers cannot be avoided","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":214,"section":"Sequence Models & Neural Network Fundamentals","question":"According to the face recognition intuition, what do the layers of a deep network learn in order?","options":{"A":"Faces — face parts — edges","B":"Words — phonemes — audio","C":"Colors only","D":"Edges — face parts — whole faces"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 002451.png","correctText":"Edges — face parts — whole faces","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":215,"section":"Sequence Models & Neural Network Fundamentals","question":"According to circuit theory, computing XOR of n bits needs what?","options":{"A":"The same size network whether deep or shallow","B":"About O(log n) layers in a deep network, but about 2° units with one hidden layer","C":"Exactly n hidden units in one layer","D":"It cannot be computed by neural networks"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 002455.png","correctText":"About O(log n) layers in a deep network, but about 2° units with one hidden layer","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":216,"section":"Sequence Models & Neural Network Fundamentals","question":"What is stored in the cache during forward propagation?","options":{"A":"The final loss only","B":"The learning rate","C":"The training labels","D":"Z^(l) (and W^(l), b^(l)) for use in the backward step"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 002459.png","correctText":"Z^(l) (and W^(l), b^(l)) for use in the backward step","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":217,"section":"Sequence Models & Neural Network Fundamentals","question":"What is the initial dA^(L) for backprop with a sigmoid output and cross-entropy loss?","options":{"A":"−Y/A + (1 − Y)/(1 − A)","B":"A − Y","C":"Y/A","D":"1 − A²"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 002502.png","correctText":"−Y/A + (1 − Y)/(1 − A)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":218,"section":"Sequence Models & Neural Network Fundamentals","question":"Which of the following are parameters (not hyperparameters)?","options":{"A":"Learning rate a and number of iterations","B":"Number of hidden layers L","C":"Weights W and biases b","D":"Choice of activation function"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 002506.png","correctText":"Weights W and biases b","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":219,"section":"Sequence Models & Neural Network Fundamentals","question":"What does the course say about the relationship between neural networks and the brain?","options":{"A":"Neural networks are an exact model of the brain","B":"The analogy is loose; even neuroscientists do not know whether the brain uses backprop","C":"The brain is proven to use gradient descent","D":"Each artificial neuron equals one biological neuron"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 002511.png","correctText":"The analogy is loose; even neuroscientists do not know whether the brain uses backprop","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":221,"section":"Improving Deep Neural Networks & ML Strategy","question":"What is the main purpose of the dev set (hold-out / cross-validation set)?","options":{"A":"Training the model's weights","B":"Giving the final unbiased estimate of performance","C":"Comparing and selecting between models","D":"Storing mislabeled examples"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 002518.png","correctText":"Comparing and selecting between models","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":222,"section":"Improving Deep Neural Networks & ML Strategy","question":"With about 1 million examples, which train/dev/test split is typical?","options":{"A":"98/1/1","B":"60/20/20","C":"70/30/0","D":"33/33/33"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 002522.png","correctText":"98/1/1","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":223,"section":"Improving Deep Neural Networks & ML Strategy","question":"Training images come from the web, while dev/test images come from a mobile app. What rule must be followed?","options":{"A":"Train and test must come from the same distribution","B":"The dev set must be larger than the training set","C":"The test set can be skipped","D":"Dev and test sets must come from the same distribution"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 002527.png","correctText":"Dev and test sets must come from the same distribution","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":224,"section":"Improving Deep Neural Networks & ML Strategy","question":"Train error is 1% and dev error is 11% (Bayes error = 0%). What is the diagnosis?","options":{"A":"High bias","B":"High variance","C":"High bias and high variance","D":"Low bias and low variance"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 002530.png","correctText":"High variance","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":225,"section":"Improving Deep Neural Networks & ML Strategy","question":"Train error is 15% and dev error is 16% (Bayes error = 0%). What is the diagnosis?","options":{"A":"High bias","B":"High variance","C":"High bias and high variance","D":"Low bias and low variance"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 002533.png","correctText":"High bias","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":226,"section":"Improving Deep Neural Networks & ML Strategy","question":"Train error is 15% and dev error is 30%. What is the diagnosis?","options":{"A":"High bias only","B":"High variance only","C":"High bias and high variance","D":"Low bias and low variance"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 002536.png","correctText":"High bias and high variance","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":227,"section":"Improving Deep Neural Networks & ML Strategy","question":"According to the basic recipe, what should you try first for high bias?","options":{"A":"Get more training data","B":"Add dropout","C":"Use a smaller network","D":"Use a bigger network or train longer"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 002539.png","correctText":"Use a bigger network or train longer","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":228,"section":"Improving Deep Neural Networks & ML Strategy","question":"According to the basic recipe, what helps with high variance?","options":{"A":"A bigger network only","B":"More data or regularization","C":"Training for fewer iterations only","D":"Removing the dev set"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 002543.png","correctText":"More data or regularization","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":229,"section":"Improving Deep Neural Networks & ML Strategy","question":"Why is L2 regularization also called \"weight decay\"?","options":{"A":"Weights are deleted after each epoch","B":"The learning rate decays over time","C":"Each update multiplies W by (1 - aA/m), shrinking it","D":"Weights decay to exactly zero"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 002548.png","correctText":"Each update multiplies W by (1 - aA/m), shrinking it","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":230,"section":"Improving Deep Neural Networks & ML Strategy","question":"What is a characteristic effect of L1 regularization?","options":{"A":"It makes weights l
