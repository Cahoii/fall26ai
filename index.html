 tên ảnh"},{"id":243,"section":"Improving Deep Neural Networks & ML Strategy","question":"With ε = 10⁻⁷, gradient checking gives a difference of about 10⁻³. What does this suggest?","options":{"A":"The implementation is great","B":"The result is fine but slightly loose","C":"There is very likely a bug","D":"ε is too small"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 003825.png","correctText":"There is very likely a bug","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":244,"section":"Improving Deep Neural Networks & ML Strategy","question":"Can gradient checking be used together with dropout?","options":{"A":"Yes, always","B":"No; turn dropout off (kKeep_prob = 1) while checking","C":"Only with keep_prob = 0.5","D":"Only during training"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 003829.png","correctText":"No; turn dropout off (kKeep_prob = 1) while checking","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":245,"section":"Improving Deep Neural Networks & ML Strategy","question":"What characterizes stochastic gradient descent (SGD) compared with mini-batch GD?","options":{"A":"It updates once per epoch","B":"It is very smooth","C":"It uses the whole training set per update","D":"It updates after each example, is very noisy and loses the speed-up of vectorization"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 003834.png","correctText":"It updates after each example, is very noisy and loses the speed-up of vectorization","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":246,"section":"Improving Deep Neural Networks & ML Strategy","question":"With n = 2000 examples, 10 epochs and mini-batch size 4, how many updates does mini-batch GD make?","options":{"A":"10","B":"5000","C":"20000","D":"500"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 003838.png","correctText":"5000","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":247,"section":"Improving Deep Neural Networks & ML Strategy","question":"When should you simply use batch gradient descent?","options":{"A":"When m is over 1 million","B":"When using GPUs","C":"When the training set is small (m < 2000)","D":"When using Adam"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 003842.png","correctText":"When the training set is small (m < 2000)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":248,"section":"Improving Deep Neural Networks & ML Strategy","question":"With B = 0.9, an exponentially weighted average roughly averages over how many recent values?","options":{"A":"About 10","B":"About 2","C":"About 50","D":"About 1000"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 003846.png","correctText":"About 10","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":249,"section":"Improving Deep Neural Networks & ML Strategy","question":"What does bias correction v_t / (1 − β^t) fix in exponentially weighted averages?","options":{"A":"Values that are too high at the end","B":"The need for a learning rate","C":"Exploding gradients","D":"Estimates that are too low in early steps because v₀ = 0"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 003849.png","correctText":"Estimates that are too low in early steps because v₀ = 0","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":250,"section":"Improving Deep Neural Networks & ML Strategy","question":"How does gradient descent with momentum help on an elongated cost surface?","options":{"A":"Vertical oscillations average out while horizontal progress accumulates","B":"It increases oscillations to escape minima","C":"It removes the need for mini-batches","D":"It normalizes the inputs"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 003854.png","correctText":"Vertical oscillations average out while horizontal progress accumulates","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":251,"section":"Improving Deep Neural Networks & ML Strategy","question":"In RMSprop, how is the update for W computed?","options":{"A":"W := W − α · v_dW","B":"W := W − α · dW²","C":"W := W − α · dW / (√S_dW + ε)","D":"W := (1 − α)W"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 003857.png","correctText":"W := W − α · dW / (√S_dW + ε)","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":252,"section":"Improving Deep Neural Networks & ML Strategy","question":"What are the commonly used default values for Adam’s β₁, β₂ and ε?","options":{"A":"0.5, 0.5, 10⁻³","B":"0.9, 0.999, 10⁻⁸","C":"0.999, 0.9, 10⁻⁸","D":"0.99, 0.99, 1"},"answer":"B","sourceImage":"Ảnh chụp màn hình 2026-11-08 003901.png","correctText":"0.9, 0.999, 10⁻⁸","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":253,"section":"Improving Deep Neural Networks & ML Strategy","question":"With α₀ = 0.2 and decay_rate = 1, using α = α₀ / (1 + decay_rate × epoch), what is α at epoch 1?","options":{"A":"0.2","B":"0.067","C":"0.05","D":"0.1"},"answer":"D","sourceImage":"Ảnh chụp màn hình 2026-11-08 003904.png","correctText":"0.1","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":254,"section":"Improving Deep Neural Networks & ML Strategy","question":"In high-dimensional spaces, most points with zero gradient are what?","options":{"A":"Bad local optima","B":"Global minima","C":"Saddle points","D":"Plateaus of exactly zero cost"},"answer":"C","sourceImage":"Ảnh chụp màn hình 2026-11-08 003909.png","correctText":"Saddle points","answerSource":"answers.csv — đối chiếu theo tên ảnh"},{"id":255,"section":"Improving Deep Neural Networks & ML Strategy","question":"Which hyperparameter is considered the most important to tune?","options":{"A":"Learning rate α","B":"Adam ε","C":"Number of layers","D":"Momentum β"},"answer":"A","sourceImage":"Ảnh chụp màn hình 2026-11-08 003914.png","correctText":"Learning rate α","answerSource":"answers.csv — đối chiếu theo tên ảnh"}];

const STORAGE = {
  progress: "dpl302-study-progress-v1",
  overrides: "dpl302-study-overrides-v1",
  custom: "dpl302-study-custom-dataset-v1"
};
const SECTION_ICONS = ["🧠","🔁","🧩","⚙️"];
const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];
function readJSON(key, fallback){ try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch(e){ return fallback; } }
function writeJSON(key, value){ try { localStorage.setItem(key, JSON.stringify(value)); } catch(e){} }
function clone(x){ return JSON.parse(JSON.stringify(x)); }

let questions = readJSON(STORAGE.custom, null) || clone(DEFAULT_QUESTIONS);
const overrides = readJSON(STORAGE.overrides, {});
let progress = readJSON(STORAGE.progress, {known:[], attempts:0, correct:0, wrong:[]});
if(!Array.isArray(progress.known)) progress.known=[];
if(!Array.isArray(progress.wrong)) progress.wrong=[];
questions = questions.map(q => ({...q, ...(overrides[q.id] || {})}));
const sections = [...new Set(questions.map(q=>q.section))];
let currentView = "dashboard";
let study = {pool:[], index:0, flipped:false, filter:"all"};
let practice = {pool:[], index:0, selected:null, checked:false, filter:"all", complete:false};
let test = {active:false, pool:[], index:0, answers:{}, submitted:false, filter:"all", size:20, shuffle:true, result:null};
let libraryPage = 1;
const PAGE_SIZE = 20;

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(message){
  const el=$("#toast"); el.textContent=message; el.classList.add("show");
  clearTimeout(toast._timer); toast._timer=setTimeout(()=>el.classList.remove("show"),2200);
}
function persistProgress(){ writeJSON(STORAGE.progress,progress); }
function knownCount(){ return progress.known.length; }
function accuracy(){ return progress.attempts ? Math.round(progress.correct/progress.attempts*100) : 0; }
function byFilter(filter){
  return filter==="all" ? [...questions] : questions.filter(q=>q.section===filter);
}
function optionMarkup(q, mode="plain", selected=null, checked=false){
  return Object.entries(q.options).map(([letter,text])=>{
    let cls="choice-btn";
    if(checked){
      if(letter===q.answer) cls+=" correct";
      else if(letter===selected) cls+=" wrong";
    } else if(letter===selected) cls+=" selected";
    return `<button class="${cls}" data-option="${letter}" ${checked?"disabled":""}>
      <span class="option-letter">${letter}</span><span>${escapeHTML(text)}</span></button>`;
  }).join("");
}
function navTo(view){
  currentView=view;
  $$(".nav-btn,[data-view].mobile-nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  const labels={dashboard:"Tổng quan",study:"Flashcards",practice:"Luyện tập",test:"Kiểm tra",library:"Ngân hàng câu hỏi"};
  $("#headerContext").textContent=labels[view]+" · "+questions.length+" câu hỏi";
  renderView();
}
function renderView(){
  const root=$("#appContent");
  if(currentView==="dashboard") root.innerHTML=renderDashboard();
  if(currentView==="study") { if(!study.pool.length) resetStudy(); root.innerHTML=renderStudy(); }
  if(currentView==="practice") { if(!practice.pool.length) resetPractice(); root.innerHTML=renderPractice(); }
  if(currentView==="test") root.innerHTML=renderTest();
  if(currentView==="library") root.innerHTML=renderLibrary();
  bindViewEvents();
}
function renderDashboard(){
  const sectionCards=sections.map((s,i)=>`
    <div class="topic-card" data-section-open="${escapeHTML(s)}">
      <div class="topic-icon">${SECTION_ICONS[i%SECTION_ICONS.length]}</div>
      <div class="topic-info"><strong>${escapeHTML(s)}</strong><span>${questions.filter(q=>q.section===s).length} câu hỏi · ${Math.round(questions.filter(q=>progress.known.includes(q.id)).length/(questions.filter(q=>q.section===s).length||1)*100)}% đã thuộc</span></div>
      <div class="topic-count">${questions.filter(q=>q.section===s).length} <span>›</span></div>
    </div>`).join("");
  const p=questions.length?Math.round(knownCount()/questions.length*100):0;
  return `
    <section class="hero">
      <div class="hero-kicker">DPL302 · Deep Learning</div>
      <h1>Ôn tập có hệ thống.<br>Ghi nhớ đến khi thật sự hiểu.</h1>
      <p>Bộ câu hỏi được trích xuất từ 252 ảnh trong tài liệu của bạn. Học bằng flashcard, luyện trắc nghiệm và tự kiểm tra theo từng chương.</p>
      <div class="hero-actions">
        <button class="primary-btn" data-go="study">Bắt đầu học thẻ →</button>
        <button class="secondary-btn" data-go="practice">Luyện câu hỏi</button>
      </div>
    </section>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-top">Tổng câu hỏi <span class="stat-icon">▤</span></div><div class="stat-value">${questions.length}</div><div class="stat-foot">Trong ${sections.length} nhóm kiến thức</div></div>
      <div class="stat-card"><div class="stat-top">Đã thuộc <span class="stat-icon">✓</span></div><div class="stat-value">${knownCount()}</div><div class="stat-foot">${p}% tổng ngân hàng câu hỏi</div></div>
      <div class="stat-card"><div class="stat-top">Lượt trả lời <span class="stat-icon">↗</span></div><div class="stat-value">${progress.attempts}</div><div class="stat-foot">Tích lũy trên thiết bị này</div></div>
      <div class="stat-card"><div class="stat-top">Độ chính xác <span class="stat-icon">◎</span></div><div class="stat-value">${accuracy()}%</div><div class="stat-foot">${progress.correct} câu đúng · ${Math.max(0,progress.attempts-progress.correct)} câu sai</div></div>
    </div>
    <div class="section-head"><div><h2>Chủ đề ôn tập</h2><p>Chọn một chương để học tập trung</p></div><button class="ghost-btn" data-go="library">Xem toàn bộ câu hỏi →</button></div>
    <div class="topic-grid">${sectionCards}</div>
    <div class="section-head"><div><h2>Tiến độ của bạn</h2><p>Tiến độ được lưu tự động trên trình duyệt hiện tại</p></div><strong style="font-size:13px;color:var(--brand)">${p}%</strong></div>
    <div class="content-card"><div class="progress-track"><div class="progress-fill" style="width:${p}%"></div></div><div class="progress-row"><span>${knownCount()} / ${questions.length} câu đã đánh dấu thuộc</span><span>${questions.length-knownCount()} câu còn lại</span></div><button class="secondary-btn" data-go="study">Tiếp tục ôn tập</button></div>`;
}
function resetStudy(){
  study.pool=byFilter(study.filter);
  study.index=Math.min(study.index,Math.max(0,study.pool.length-1));
  study.flipped=false;
}
function renderStudy(){
  const q=study.pool[study.index];
  if(!q) return `<div class="empty-state"><strong>Không có câu hỏi</strong>Hãy chọn một chủ đề khác.</div>`;
  const known=progress.known.includes(q.id);
  const percent=Math.round((study.index+1)/study.pool.length*100);
  return `
    <div class="page-title">Flashcards</div><p class="page-subtitle">Đọc câu hỏi, tự trả lời rồi lật thẻ để kiểm tra đáp án.</p>
    <div class="toolbar">
      <select class="select-field" id="studyFilter"><option value="all">Tất cả chủ đề</option>${sections.map(s=>`<option value="${escapeHTML(s)}" ${study.filter===s?"selected":""}>${escapeHTML(s)}</option>`).join("")}</select>
      <button class="secondary-btn" id="shuffleStudy">⤨ Trộn thẻ</button>
      <span class="small-muted">${knownCount()} câu đã thuộc</span>
    </div>
    <div class="flashcard-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div>
      <div class="progress-row"><span>Thẻ ${study.index+1} / ${study.pool.length}</span><span>${known?"✓ Đã thuộc":"○ Chưa đánh dấu"}</span></div>
      <div class="flashcard ${study.flipped?"flipped":""}" id="flashcard" role="button" tabindex="0" aria-label="Lật thẻ">
        <div class="flash-inner">
          <div class="flash-face flash-front">
            <div class="card-topline"><span class="pill">${escapeHTML(q.section)}</span><span>${String(q.id).padStart(3,"0")} · CÂU HỎI</span></div>
            <div class="flash-question">${escapeHTML(q.question)}</div>
            <div class="flash-options">${Object.entries(q.options).map(([k,v])=>`<div class="flash-option"><span class="option-letter">${k}</span><span>${escapeHTML(v)}</span></div>`).join("")}</div>
            <div class="flip-hint">Nhấn vào thẻ hoặc nút bên dưới để xem đáp án · Space</div>
          </div>
          <div class="flash-face flash-back">
            <div class="card-topline"><span class="pill">ĐÁP ÁN</span><span>${String(q.id).padStart(3,"0")}</span></div>
            <div style="margin:auto 0">
              <div class="answer-letter">Đáp án ${q.answer}</div>
              <div class="answer-text">${escapeHTML(q.correctText)}</div>
              <div class="answer-note">Đáp án được đối chiếu theo tên ảnh trong <b>answers.csv</b>. Bạn có thể chỉnh sửa nếu phát hiện lỗi OCR.</div>
            </div>
            <div class="flip-hint">Nhấn vào thẻ để quay lại câu hỏi</div>
          </div>
        </div>
      </div>
      <div class="study-controls">
        <button class="secondary-btn" id="studyAgain">↻ Cần ôn lại</button>
        <button class="primary-btn" id="flipStudy">${study.flipped?"Xem câu hỏi":"Lật thẻ / Xem đáp án"}</button>
        <button class="secondary-btn" id="studyKnown">✓ Đã thuộc</button>
      </div>
      <div class="study-nav"><button class="ghost-btn" id="studyPrev">← Trước</button><span>← → để chuyển thẻ · Space để lật</span><button class="ghost-btn" id="studyNext">Tiếp theo →</button></div>
    </div>`;
}
function resetPractice(){
  practice.pool=byFilter(practice.filter);
  practice.index=0; practice.selected=null; practice.checked=false; practice.complete=false;
}
function renderPractice(){
  if(practice.complete) return `<div class="result-hero"><div class="pill">HOÀN THÀNH LƯỢT LUYỆN</div><h2>Bạn đã đi hết bộ câu hỏi này</h2><p class="page-subtitle">Bạn có thể luyện lại hoặc chuyển sang chế độ kiểm tra.</p><button class="primary-btn" id="practiceRestart">Luyện lại</button></div>`;
  const q=practice.pool[practice.index];
  if(!q) return `<div class="empty-state"><strong>Không có câu hỏi</strong></div>`;
  const pct=Math.round((practice.index+1)/practice.pool.length*100);
  let feedback="";
  if(practice.checked){
    feedback=practice.selected===q.answer
      ? `<div class="feedback good"><b>Chính xác!</b> Đáp án ${q.answer}: ${escapeHTML(q.correctText)}</div>`
      : `<div class="feedback bad"><b>Chưa chính xác.</b> Đáp án đúng là ${q.answer}: ${escapeHTML(q.correctText)}</div>`;
  }
  return `<div class="page-title">Luyện tập</div><p class="page-subtitle">Chọn một đáp án. Hệ thống sẽ phản hồi ngay để bạn biết mình cần ôn phần nào.</p>
    <div class="toolbar"><select class="select-field" id="practiceFilter"><option value="all">Tất cả chủ đề</option>${sections.map(s=>`<option value="${escapeHTML(s)}" ${practice.filter===s?"selected":""}>${escapeHTML(s)}</option>`).join("")}</select><span class="small-muted">Câu ${practice.index+1} / ${practice.pool.length}</span></div>
    <div class="question-panel content-card">
      <div class="card-topline"><span class="pill">${escapeHTML(q.section)}</span><span class="small-muted">Câu ${String(q.id).padStart(3,"0")}</span></div>
      <h2 class="question-title">${escapeHTML(q.question)}</h2>
      <div class="choice-list" id="practiceChoices">${optionMarkup(q,"practice",practice.selected,practice.checked)}</div>
      ${feedback}
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="study-nav"><button class="ghost-btn" id="practicePrev" ${practice.index===0?"disabled":""}>← Trước</button><span>${practice.index+1} / ${practice.pool.length}</span><button class="primary-btn" id="practiceNext" ${!practice.checked?"disabled":""}>${practice.index===practice.pool.length-1?"Hoàn thành":"Câu tiếp theo →"}</button></div>
    </div>`;
}
function renderTest(){
  if(!test.active){
    return `<div class="page-title">Kiểm tra kiến thức</div><p class="page-subtitle">Tạo một bài kiểm tra mô phỏng. Đáp án chỉ được hiển thị sau khi nộp bài.</p>
      <div class="content-card" style="max-width:700px;margin-top:20px">
        <div class="form-row"><label>Phạm vi kiến thức</label><select class="select-field" id="testFilter"><option value="all">Tất cả chủ đề</option>${sections.map(s=>`<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`).join("")}</select></div>
        <div class="form-row" style="margin-top:15px"><label>Số câu hỏi</label><select class="select-field" id="testSize"><option value="10">10 câu</option><option value="20" selected>20 câu</option><option value="50">50 câu</option><option value="all">Toàn bộ câu hỏi trong phạm vi</option></select></div>
        <label style="display:flex;align-items:center;gap:9px;font-size:12px;margin:16px 0"><input type="checkbox" id="testShuffle" checked> Trộn thứ tự câu hỏi</label>
        <button class="primary-btn" id="startTest">Bắt đầu kiểm tra →</button>
      </div>`;
  }
  if(test.submitted) return renderTestResult();
  const q=test.pool[test.index];
  const answered=Object.prototype.hasOwnProperty.call(test.answers,q.id);
  const pct=Math.round((test.index+1)/test.pool.length*100);
  return `<div class="page-title">Bài kiểm tra</div><p class="page-subtitle">Chọn một đáp án cho mỗi câu. Bạn có thể quay lại trước khi nộp bài.</p>
    <div class="toolbar"><span class="pill">${escapeHTML(q.section)}</span><span class="small-muted">Đã trả lời ${Object.keys(test.answers).length} / ${test.pool.length}</span><span class="small-muted" style="margin-left:auto">Câu ${test.index+1} / ${test.pool.length}</span></div>
    <div class="content-card question-panel">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <h2 class="question-title">${escapeHTML(q.question)}</h2>
      <div class="choice-list" id="testChoices">${Object.entries(q.options).map(([k,v])=>`<button class="choice-btn ${test.answers[q.id]===k?"selected":""}" data-option="${k}"><span class="option-letter">${k}</span><span>${escapeHTML(v)}</span></button>`).join("")}</div>
      <div class="study-nav"><button class="ghost-btn" id="testPrev" ${test.index===0?"disabled":""}>← Trước</button><span>${answered?"Đã chọn: "+test.answers[q.id]:"Chưa trả lời"}</span><button class="primary-btn" id="testNext">${test.index===test.pool.length-1?"Xem lại bài →":"Tiếp theo →"}</button></div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="secondary-btn" id="submitTest">Nộp bài</button></div>
    </div>`;
}
function renderTestResult(){
  const correct=test.pool.filter(q=>test.answers[q.id]===q.answer).length;
  const pct=Math.round(correct/test.pool.length*100);
  const items=test.pool.map(q=>{
    const given=test.answers[q.id]||"Chưa trả lời";
    const ok=given===q.answer;
    return `<div class="result-item"><div style="display:flex;justify-content:space-between;gap:10px"><strong>Câu ${q.id} · ${escapeHTML(q.section)}</strong><span style="font-size:11px;font-weight:850;color:${ok?"var(--green)":"var(--red)"}">${ok?"ĐÚNG":"SAI"}</span></div><p>${escapeHTML(q.question)}</p><p>Bạn chọn: <b>${given}</b> · Đáp án đúng: <b>${q.answer}. ${escapeHTML(q.correctText)}</b></p></div>`;
  }).join("");
  return `<div class="result-hero"><div class="pill">KẾT QUẢ BÀI KIỂM TRA</div><div class="result-score">${pct}%</div><h2>${correct} / ${test.pool.length} câu đúng</h2><p class="page-subtitle">${pct>=80?"Rất tốt! Hãy tiếp tục duy trì.":pct>=60?"Bạn đã nắm được một phần, hãy xem lại các câu sai.":"Hãy ôn lại flashcards theo từng chủ đề rồi thử lại nhé."}</p><button class="primary-btn" id="testAgain">Tạo bài kiểm tra mới</button></div><div class="section-head"><div><h2>Chi tiết từng câu</h2><p>Đáp án đúng và lựa chọn của bạn</p></div></div><div class="result-list">${items}</div>`;
}
function renderLibrary(){
  const filter=libraryState.filter;
  const term=libraryState.search.trim().toLowerCase();
  const filtered=questions.filter(q=>(filter==="all"||q.section===filter) && (!term || (q.question+" "+Object.values(q.options).join(" ")).toLowerCase().includes(term)));
  const pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  libraryPage=Math.min(libraryPage,pages);
  const visible=filtered.slice((libraryPage-1)*PAGE_SIZE,libraryPage*PAGE_SIZE);
  return `<div class="page-title">Ngân hàng câu hỏi</div><p class="page-subtitle">Tìm kiếm, xem đáp án và chỉnh sửa nội dung OCR khi cần.</p>
    <div class="toolbar"><input class="field search-field" id="librarySearch" placeholder="Tìm câu hỏi hoặc nội dung đáp án..." value="${escapeHTML(libraryState.search)}"><select class="select-field" id="libraryFilter"><option value="all">Tất cả chủ đề</option>${sections.map(s=>`<option value="${escapeHTML(s)}" ${filter===s?"selected":""}>${escapeHTML(s)}</option>`).join("")}</select><span class="small-muted">${filtered.length} kết quả</span><button class="secondary-btn" id="exportCSVBtn">↓ Xuất CSV</button></div>
    <div class="bank-list">${visible.map(q=>`<div class="bank-item"><div class="bank-id">${String(q.id).padStart(3,"0")}</div><div><div class="bank-question">${escapeHTML(q.question)}</div><div class="bank-meta">${escapeHTML(q.section)} · ${Object.keys(q.options).length} lựa chọn</div></div><div class="bank-actions"><span class="bank-answer">${q.answer} · ${escapeHTML(q.correctText).slice(0,28)}${q.correctText.length>28?"…":""}</span><button class="mini-btn" data-edit="${q.id}">Sửa</button></div></div>`).join("") || `<div class="empty-state"><strong>Không tìm thấy câu hỏi</strong>Thử một từ khóa hoặc chủ đề khác.</div>`}</div>
    <div class="pagination"><button class="mini-btn" id="libraryPrev" ${libraryPage<=1?"disabled":""}>← Trước</button><span>Trang ${libraryPage} / ${pages}</span><button class="mini-btn" id="libraryNext" ${libraryPage>=pages?"disabled":""}>Tiếp →</button></div>`;
}
let libraryState={filter:"all",search:""};

function bindViewEvents(){
  $$("[data-go]").forEach(b=>b.addEventListener("click",()=>navTo(b.dataset.go)));
  $$("[data-section-open]").forEach(b=>b.addEventListener("click",()=>{study.filter=b.dataset.sectionOpen;study.index=0;resetStudy();navTo("study");}));
  if(currentView==="study"){
    $("#studyFilter")?.addEventListener("change",e=>{study.filter=e.target.value;study.index=0;resetStudy();renderView();});
    $("#shuffleStudy")?.addEventListener("click",()=>{study.pool=shuffle([...byFilter(study.filter)]);study.index=0;study.flipped=false;renderView();});
    $("#flashcard")?.addEventListener("click",()=>{study.flipped=!study.flipped;renderView();});
    $("#flashcard")?.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();study.flipped=!study.flipped;renderView();}});
    $("#flipStudy")?.addEventListener("click",()=>{study.flipped=!study.flipped;renderView();});
    $("#studyPrev")?.addEventListener("click",()=>moveStudy(-1));
    $("#studyNext")?.addEventListener("click",()=>moveStudy(1));
    $("#studyKnown")?.addEventListener("click",()=>markKnown(true));
    $("#studyAgain")?.addEventListener("click",()=>markKnown(false));
  }
  if(currentView==="practice"){
    $("#practiceFilter")?.addEventListener("change",e=>{practice.filter=e.target.value;resetPractice();renderView();});
    $$("#practiceChoices [data-option]").forEach(b=>b.addEventListener("click",()=>selectPractice(b.dataset.option)));
    $("#practiceNext")?.addEventListener("click",()=>nextPractice());
    $("#practicePrev")?.addEventListener("click",()=>{if(practice.index>0){practice.index--;practice.selected=null;practice.checked=false;renderView();}});
    $("#practiceRestart")?.addEventListener("click",()=>{resetPractice();renderView();});
  }
  if(currentView==="test"){
    $("#startTest")?.addEventListener("click",startTest);
    $$("#testChoices [data-option]").forEach(b=>b.addEventListener("click",()=>{const q=test.pool[test.index];test.answers[q.id]=b.dataset.option;renderView();}));
    $("#testPrev")?.addEventListener("click",()=>{test.index=Math.max(0,test.index-1);renderView();});
    $("#testNext")?.addEventListener("click",()=>{if(test.index<test.pool.length-1){test.index++;renderView();}else toast("Bạn đã xem hết câu hỏi. Có thể nộp bài.");});
    $("#submitTest")?.addEventListener("click",()=>{if(confirm("Nộp bài kiểm tra ngay bây giờ?"))submitTest();});
    $("#testAgain")?.addEventListener("click",()=>{test={active:false,pool:[],index:0,answers:{},submitted:false,filter:"all",size:20,shuffle:true,result:null};renderView();});
  }
  if(currentView==="library"){
    $("#exportCSVBtn")?.addEventListener("click",exportCSV);
    $("#librarySearch")?.addEventListener("input",e=>{libraryState.search=e.target.value;libraryPage=1;renderViewPreserveSearch();});
    $("#libraryFilter")?.addEventListener("change",e=>{libraryState.filter=e.target.value;libraryPage=1;renderView();});
    $("#libraryPrev")?.addEventListener("click",()=>{libraryPage--;renderView();});
    $("#libraryNext")?.addEventListener("click",()=>{libraryPage++;renderView();});
    $$("[data-edit]").forEach(b=>b.addEventListener("click",()=>openEditor(Number(b.dataset.edit))));
  }
}
function renderViewPreserveSearch(){
  const input=$("#librarySearch"), pos=input?.selectionStart;
  renderView();
  const next=$("#librarySearch"); if(next){next.focus();next.setSelectionRange(pos,pos);}
}
function moveStudy(delta){
  study.index=(study.index+delta+study.pool.length)%study.pool.length;
  study.flipped=false;renderView();
}
function markKnown(value){
  const q=study.pool[study.index];
  if(!q)return;
  progress.known=progress.known.filter(id=>id!==q.id);
  if(value) progress.known.push(q.id);
  progress.known=[...new Set(progress.known)];
  persistProgress();
  if(study.index<study.pool.length-1) study.index++;
  study.flipped=false;renderView();
}
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}return array;}
function selectPractice(letter){
  if(practice.checked)return;
  const q=practice.pool[practice.index];
  practice.selected=letter;practice.checked=true;
  progress.attempts++;
  if(letter===q.answer){progress.correct++;progress.wrong=progress.wrong.filter(id=>id!==q.id);}
  else if(!progress.wrong.includes(q.id)) progress.wrong.push(q.id);
  persistProgress();renderView();
}
function nextPractice(){
  if(!practice.checked)return;
  if(practice.index<practice.pool.length-1){practice.index++;practice.selected=null;practice.checked=false;renderView();}
  else{practice.complete=true;renderView();}
}
function startTest(){
  const filter=$("#testFilter").value;
  const raw=byFilter(filter);
  const size=$("#testSize").value;
  const count=size==="all"?raw.length:Math.min(Number(size),raw.length);
  const doShuffle=$("#testShuffle").checked;
  const pool=doShuffle?shuffle(raw):raw;
  test={active:true,pool:pool.slice(0,count),index:0,answers:{},submitted:false,filter,size,shuffle:doShuffle,result:null};
  renderView();
}
function submitTest(){
  test.submitted=true;
  const correct=test.pool.filter(q=>test.answers[q.id]===q.answer).length;
  progress.attempts+=test.pool.length;
  progress.correct+=correct;
  test.pool.forEach(q=>{
    if(test.answers[q.id]===q.answer) progress.wrong=progress.wrong.filter(id=>id!==q.id);
    else if(!progress.wrong.includes(q.id)) progress.wrong.push(q.id);
  });
  persistProgress();renderView();
}
function openEditor(id){
  const q=questions.find(x=>x.id===id);if(!q)return;
  $("#modalRoot").innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal">
    <div class="modal-head"><h3>Chỉnh sửa câu ${q.id}</h3><button class="mini-btn" id="closeModal">✕</button></div>
    <div class="modal-body">
      <div class="form-row"><label>Chủ đề</label><select id="editSection">${sections.map(s=>`<option ${q.section===s?"selected":""}>${escapeHTML(s)}</option>`).join("")}</select></div>
      <div class="form-row"><label>Câu hỏi</label><textarea id="editQuestion">${escapeHTML(q.question)}</textarea></div>
      ${"ABCD".split("").map(k=>`<div class="form-row"><label>Phương án ${k}</label><textarea id="edit${k}">${escapeHTML(q.options[k])}</textarea></div>`).join("")}
      <div class="form-row"><label>Đáp án đúng (theo Note)</label><select id="editAnswer">${"ABCD".split("").map(k=>`<option value="${k}" ${q.answer===k?"selected":""}>${k}</option>`).join("")}</select></div>
      <div class="small-muted">Ảnh gốc: ${escapeHTML(q.sourceImage)}</div>
    </div>
    <div class="modal-foot"><button class="secondary-btn" id="cancelEdit">Hủy</button><button class="primary-btn" id="saveEdit">Lưu thay đổi</button></div>
  </div></div>`;
  $("#closeModal").onclick=closeEditor;$("#cancelEdit").onclick=closeEditor;
  $("#modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeEditor();});
  $("#saveEdit").onclick=()=>{
    const updated={
      ...q,
      section:$("#editSection").value,
      question:$("#editQuestion").value.trim(),
      options:{A:$("#editA").value.trim(),B:$("#editB").value.trim(),C:$("#editC").value.trim(),D:$("#editD").value.trim()},
      answer:$("#editAnswer").value
    };
    if(!updated.question||Object.values(updated.options).some(x=>!x)){toast("Vui lòng điền đủ câu hỏi và 4 lựa chọn.");return;}
    updated.correctText=updated.options[updated.answer];
    const idx=questions.findIndex(x=>x.id===id);questions[idx]=updated;
    overrides[id]=updated;writeJSON(STORAGE.overrides,overrides);writeJSON(STORAGE.custom,questions);
    closeEditor();renderView();toast("Đã lưu câu hỏi.");
  };
}
function closeEditor(){ $("#modalRoot").innerHTML=""; }
function exportBackup(){
  const data={app:"DPL302 Study Space",version:1,exportedAt:new Date().toISOString(),questions,progress,overrides};
  download("DPL302-study-backup.json",JSON.stringify(data,null,2),"application/json");
  toast("Đã xuất file backup JSON.");
}
function exportCSV(){
  const cols=["id","section","question","option_A","option_B","option_C","option_D","answer","correct_text","source_image"];
  const rows=[cols.join(",")];
  questions.forEach(q=>{
    const vals=[q.id,q.section,q.question,q.options.A,q.options.B,q.options.C,q.options.D,q.answer,q.correctText,q.sourceImage];
    rows.push(vals.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(","));
  });
  download("DPL302-questions.csv","\uFEFF"+rows.join("\r\n"),"text/csv;charset=utf-8");
}
function download(name,content,type){
  const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const imported=Array.isArray(data)?data:data.questions;
      if(!Array.isArray(imported)||!imported.length)throw new Error("Không tìm thấy danh sách câu hỏi.");
      const valid=imported.every(q=>q.question&&q.options&&q.answer&&q.options[q.answer]);
      if(!valid)throw new Error("Dữ liệu câu hỏi không đúng định dạng.");
      questions=imported;
      progress=data.progress||progress;
      writeJSON(STORAGE.custom,questions);persistProgress();
      navTo("dashboard");toast("Đã nhập "+questions.length+" câu hỏi.");
    }catch(e){alert("Không thể nhập backup: "+e.message);}
  };
  reader.readAsText(file);
}
$("#exportBtn").addEventListener("click",exportBackup);
$("#importBtn").addEventListener("click",()=>$("#importFile").click());
$("#importFile").addEventListener("change",e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value="";});
$$("[data-view]").forEach(b=>b.addEventListener("click",()=>navTo(b.dataset.view)));
document.addEventListener("keydown",e=>{
  if(currentView==="study" && !$("#modalRoot").innerHTML){
    if(e.code==="Space" && !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){e.preventDefault();study.flipped=!study.flipped;renderView();}
    if(e.key==="ArrowRight")moveStudy(1);
    if(e.key==="ArrowLeft")moveStudy(-1);
  }
});
navTo("dashboard");
</script>
</body>
</html>
